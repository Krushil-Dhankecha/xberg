# Local WASM demo environment, included from mise.toml [task_config]. ~keep

["demo:dev"]
description = "Build, patch demo for localhost, and start both dev servers"
run = [
  { task = "demo:dev:build" },
  { task = "demo:dev:patch" },
  { task = "demo:dev:ready" },
  { task = "demo:dev:serve" },
]

# Bake the same env/wasi ESM shim the publish pipeline applies, so local dev loads pkg/web exactly
# as production consumers do. ~keep
["demo:dev:build"]
description = "Build WASM web target and shim its env/wasi imports (unless SKIP_WASM_BUILD=1)"
dir = "{{config_root}}/crates/xberg-wasm"
run = '[ "${SKIP_WASM_BUILD:-0}" = "1" ] || { pnpm run build:wasm:web && node scripts/fix-wasi-imports.mjs; }'

["demo:dev:patch"]
description = "Generate docs-site/public/demo-dev.html with CDN URLs replaced by localhost:9000"
run = "node scripts/task/patch-demo-dev.mjs"

["demo:dev:serve"]
description = "Start docs server (port 8001) and WASM asset server (port 9000) in parallel"
depends = ["demo:dev:serve:docs", "demo:dev:serve:assets"]

["demo:dev:serve:docs"]
description = "Serve the demo (docs-site/public) on http://localhost:8001"
run = "npx --yes serve docs-site/public --cors -l tcp://0.0.0.0:8001"

["demo:dev:serve:assets"]
description = "Serve WASM assets on http://localhost:9000 (simulates CDN origin)"
dir = "{{config_root}}/crates/xberg-wasm"
run = "npx --yes serve . --cors -l tcp://0.0.0.0:9000"

["demo:dev:setup"]
description = "Install demo:dev prerequisites (wasm-pack, wasm-bindgen-cli, WASI SDK 25)"
run = [
  { task = "demo:dev:setup:wasm-pack" },
  { task = "demo:dev:setup:wasm-bindgen-cli" },
  { task = "demo:dev:setup:wasi-sdk" },
]
