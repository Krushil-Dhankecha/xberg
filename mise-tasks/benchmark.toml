# Benchmark harness tasks, included from mise.toml [task_config]. vars.bench_fixtures is the
# shared fixture corpus. ~keep

["benchmark:setup:swap"]
description = "Provision Linux swap for the benchmark all-feature release link"
depends = ["os:require linux"]
run = 'SWAP_SIZE_GIB="${SWAP_SIZE_GIB:-16}" bash scripts/ci/benchmarks/setup-build-swap.sh'

["benchmark:validate:scripts"]
description = "Validate benchmark workflow configuration and Python adapters"
run = [
  "scripts/ci/benchmarks/validate-workflow-build-config.sh",
  "python3 -m unittest scripts/ci/benchmarks/test_validate_workflow_matrix.py",
  "python3 -m unittest scripts/ci/benchmarks/test_dependency_groups.py",
  "python3 -m unittest tools/benchmark-harness/tests/test_corpus_cache_manifest.py",
  "python3 -m unittest tools/benchmark-harness/tests/test_docling_extract.py",
  "python3 -m unittest tools/benchmark-harness/tests/test_mineru_extract.py",
]

["benchmark:validate:layout-annotations"]
description = "Validate independent layout ground-truth preservation and identity checks"
run = "uv run --no-sync python -m pytest -q tools/benchmark-harness/tests/test_import_omnidocbench.py"

["benchmark:test"]
description = "Run benchmark harness unit and integration tests"
run = "cargo test --locked -p benchmark-harness"

["benchmark:local"]
description = "Local head-to-head PDF benchmark: xberg vs liteparse (+docling if installed) with per-document gap report"
run = "bash tools/benchmark-harness/scripts/bench_local.sh"

["benchmark:models"]
description = "Compare actual RT-DETR and PP-DocLayoutV3 detector timing and counts"
run = 'cargo run --locked -p benchmark-harness -- model-benchmark --fixtures "{{vars.bench_fixtures}}"'

["benchmark:models:validate"]
description = "Validate detector artifact identities and complete page/arm counts"
run = "cargo run --locked -p benchmark-harness -- model-benchmark-validate"

["benchmark:corpus:cache:publish"]
description = "Verify and publish the content-addressed reference corpus cache. Run after a corpus rebuild + build_corpus.py --stage materialize."
run = "scripts/benchmarks/publish-corpus-cache.sh"

["benchmark:corpus:cache:restore"]
description = "Restore the verified reference corpus cache for the current manifest"
run = "scripts/benchmarks/restore-corpus-cache.sh"
